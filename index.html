<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zach Adams Effect</title>
<meta name="description" content="Zach Adams Effect - AI, tech, and security, without the spin. Analysis and commentary on artificial intelligence, the security apocalypse, surveillance, Big Tech power, and the fight for a free and open internet.">
<link rel="icon" href="/assets/avatar.png">
<meta property="og:title" content="Zach Adams Effect">
<meta property="og:description" content="AI, tech, and security - without the spin.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://zachadamseffect.com/">
<meta property="og:image" content="https://zachadamseffect.com/assets/banner.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root {
    --bg: #0b0b0d;
    --panel: #141418;
    --fg: #f2f2f4;
    --muted: #9a9aa6;
    --accent: #ff7a1a;
    --border: #26262e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 56px 24px 24px;
    gap: 8px;
  }
  .avatar {
    width: 132px;
    height: 132px;
    border-radius: 50%;
    border: 2px solid var(--border);
    box-shadow: 0 0 0 6px rgba(255, 122, 26, 0.08);
    margin-bottom: 22px;
  }
  h1 {
    margin: 0;
    font-size: clamp(2rem, 7vw, 3.4rem);
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .tagline {
    margin: 14px 0 0;
    font-size: clamp(1.02rem, 2.4vw, 1.3rem);
    font-weight: 600;
    color: var(--accent);
  }
  .blurb {
    max-width: 46ch;
    margin: 18px 0 0;
    font-size: 1rem;
    line-height: 1.65;
    color: var(--muted);
  }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 34px;
    padding: 14px 26px;
    border-radius: 999px;
    background: var(--accent);
    color: #14100c;
    font-weight: 700;
    text-decoration: none;
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  .cta:hover { filter: brightness(1.08); transform: translateY(-1px); }
  footer {
    border-top: 1px solid var(--border);
    padding: 20px 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: space-between;
    align-items: center;
    font-size: 0.86rem;
    color: var(--muted);
  }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--fg); }
</style>
</head>
<body>
  <main>
    <img class="avatar" src="/assets/avatar.png" alt="Zach Adams Effect monogram">
    <h1>Zach Adams Effect</h1>
    <p class="tagline">AI, tech, and security &mdash; without the spin.</p>
    <p class="blurb">
      Analysis and commentary on artificial intelligence, the security apocalypse,
      surveillance, Big Tech power, and the fight for a free and open internet.
    </p>
    <a class="cta" href="https://www.youtube.com/@ZachAdamsEffect">Watch on YouTube &rarr;</a>
  </main>
  <footer>
    <span>&copy; 2026 Zach Vorhies</span>
    <span><a href="/privacy/">Privacy policy</a></span>
  </footer>
</body>
</html>
